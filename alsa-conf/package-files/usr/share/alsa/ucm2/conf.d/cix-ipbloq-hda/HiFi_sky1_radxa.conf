#CIX SKY1 RADXA HDA HiFi conf
#
Syntax 6

SectionDevice."Lineout" {
	Comment "Lineout"

	EnableSequence [
		cset "name='Auto-Mute Mode' 0"
		cset "name='Master Playback Switch' 1"
		cset "name='Master Playback Volume' 80%"
		cset "name='Line Out Playback Switch' 1,1"
		cset "name='Headphone+LO Playback Volume' 80%"
		cset "name='Headphone Playback Switch' 0,0"
		cset "name='Speaker Playback Switch' 0,0"
	]

	DisableSequence [
		cset "name='Line Out Playback Switch' 0,0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Front Line Out Jack"
#		PlaybackVolume "name='Master Playback Volume'"
	}
}
SectionDevice."Linein" {
	Comment "Linein"

	EnableSequence [
		cset "name='Input Source',index=1 1"
		cset "name='Capture Switch',index=1 1,1"
		cset "name='Capture Volume',index=1 80%"
		cset "name='Front Mic Boost Volume' 2,2"
		cset "name='Rear Mic Boost Volume' 0,0"
	]

	DisableSequence [
		cset "name='Capture Switch',index=1 0,0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		JackControl "Front Mic Jack"
#		CaptureVolume "name='Capture Volume',index=1"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Auto-Mute Mode' 0"
		cset "name='Master Playback Switch' 1"
		cset "name='Master Playback Volume' 80%"
		cset "name='Speaker Playback Switch' 1,1"
		cset "name='Speaker Playback Volume' 80%"
		cset "name='Line Out Playback Switch' 0,0"
		cset "name='Headphone Playback Switch' 0,0"
	]

	DisableSequence [
		cset "name='Speaker Playback Switch' 0,0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
#		JackControl "Speaker Phantom Jack"
#		PlaybackVolume "name='Master Playback Volume'"
	}
}

SectionDevice."Headset" {
	Comment "Headphone"

	EnableSequence [
		cset "name='Auto-Mute Mode' 0"
		cset "name='Master Playback Switch' 1"
		cset "name='Master Playback Volume' 80%"
		cset "name='Headphone Playback Switch' 1,1"
		cset "name='Headphone+LO Playback Volume' 80%"
		cset "name='Line Out Playback Switch' 0,0"
		cset "name='Speaker Playback Switch' 0,0"
	]

	DisableSequence [
		cset "name='Headphone Playback Switch' 0,0"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
#		PlaybackVolume "name='Master Playback Volume'"
	}
}

SectionDevice."Headset Mic" {
	Comment "Headset Mic"

	EnableSequence [
		cset "name='Input Source' 0"
		cset "name='Capture Switch' 1,1"
		cset "name='Capture Volume' 80%"
		cset "name='Rear Mic Boost Volume' 2,2"
		cset "name='Front Mic Boost Volume' 0,0"
	]

	DisableSequence [
		cset "name='Capture Switch' 0,0"
	]

	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},0"
		JackControl "Rear Mic Jack"
#		CaptureVolume "name='Capture Volume'"
	}
}
