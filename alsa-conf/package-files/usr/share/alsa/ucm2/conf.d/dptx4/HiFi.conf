Syntax 6

SectionDevice."HDMI4" {
        Comment "HDMI/Display Port 4 Stereo"

        Value {
		PlaybackPriority 300
		If.1 {
			Condition {
				Type ControlExists
				Control "iface=CARD,name='HDMI/DP,pcm=4 Jack'"
			}
			True {
				JackControl "HDMI/DP,pcm=4 Jack"
				PlaybackPCM "hw:${CardId},0"
			}
		}
	}
}
